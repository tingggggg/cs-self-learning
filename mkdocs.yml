site_name: CS Self-Learning
site_url: https://tingggggg.github.io/cs-self-learning/
site_author: Syun-Ting Li
site_description: >-
  Syun-Ting Li's CS self-learning log: courses, labs, and side projects, organized by topic.

repo_name: tingggggg/cs-self-learning
repo_url: https://github.com/tingggggg/cs-self-learning/

copyright: Copyright &copy; 2021-present <a href="https://github.com/tingggggg" target="_blank" rel="noopener noreferrer">Syun-Ting Li</a>

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Operating Systems:
      - "NTHU OS: NachOS": operating-systems/nthu-nachos.md
      - "Raspberry Pi OS (ARMv8)": operating-systems/raspberry-pi-os.md
      - "RISC-V OS (QEMU)": operating-systems/riscv-os.md
  - Linux Kernel:
      - "NCKU Linux Kernel Internals: fibdrv": linux-kernel/ncku-linux-kernel.md
  - Computer Vision:
      - "Advanced Digital Image Processing": computer-vision/advanced-dip.md
